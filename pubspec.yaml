name: sanad
description: "A new Flutter project."

publish_to: "none"

version: 1.2.1+8

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  cupertino_icons: ^1.0.6
  
  # Routing
  auto_route: ^8.1.2
  
  # Dependency Injection
  get_it: ^8.0.0
  injectable: ^2.5.0

  # State Management
  flutter_bloc: ^8.1.6

  # Networking
  dio: ^5.7.0
  dio_cache_interceptor: ^3.5.0
  awesome_dio_interceptor: ^1.2.0
  dio_smart_retry: ^6.0.0
  json_annotation: ^4.9.0
  retrofit: ^4.6.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4

  # Authentication
  flutter_facebook_auth: ^7.1.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  jwt_decoder: ^2.0.1

  # Localization & Internationalization
  easy_localization: ^3.0.7
  easy_logger: ^0.0.2
  intl: ^0.19.0

  # Media & File Handling
  image_picker: ^1.1.2
  video_player: ^2.9.5
  chewie: ^1.11.3
  file_picker: ^8.0.3
  camerawesome: ^2.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  image_cropper: ^9.1.0
  record: ^4.4.4

  # Notifications & Permissions
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

  # Webview & Browser
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  webview_flutter: ^4.7.0

  # UI Components
  pin_code_fields: ^8.0.1
  dropdown_search: ^6.0.1
  another_flutter_splash_screen: ^1.2.1
  carousel_slider: ^5.0.0
  skeletonizer: ^1.4.2
  infinite_scroll_pagination: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  table_calendar: ^3.1.2
  country_flags: ^3.0.0
  phone_form_field: ^9.2.8
  syncfusion_flutter_charts: ^27.1.53


  # Utilities
  freezed_annotation: ^2.4.4
  flutter_screenutil: ^5.9.3
  lottie: ^3.1.3
  colorize: ^3.0.0
  path_provider: ^2.1.5
  streaming_shared_preferences: ^2.0.0
  flutter_timer_countdown: ^1.0.7
  device_preview: ^1.2.0
  share_plus: ^10.0.0
  firebase_crashlytics: ^4.3.4
  timeago: ^3.7.0
  drop_down_list: ^0.0.8
  flutter_fgbg: ^0.6.0
  flutter_twilio_conversations: ^2.0.9+19
  flutter_phoenix: ^1.1.1
  shared_preferences: ^2.3.3

  # Analytics
  facebook_app_events: ^0.20.1
  app_tracking_transparency: ^2.0.6+1
  firebase_analytics: ^11.6.0

#dependency_overrides:
#  webview_flutter_android: 3.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.11
  auto_route_generator: ^8.0.0
  injectable_generator: ^2.6.2
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  flutter_gen_runner: ^5.8.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/readex/ReadexPro-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/readex/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/readex/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/readex/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/readex/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/readex/ReadexPro-Bold.ttf
          weight: 700
    - family: almarai
      fonts:
        - asset: assets/fonts/almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/almarai/Almarai-ExtraBold.ttf
          weight: 800
    - family: Whisper
      fonts:
        - asset: assets/fonts/whisper/Whisper-Regular.ttf
          weight: 400
